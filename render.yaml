services:
  - type: web
    name: kimi-webui
    runtime: python
    buildCommand: pip install --upgrade pip
    startCommand: python3 server.py
    envVars:
      - key: KIMI_WEBUI_PASSWORD
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: KIMI_MODEL
        value: "ibm/granite-34b-code-instruct"
    ports:
      - port: 10000
        type: http
    scaling:
      minInstances: 0
      maxInstances: 1
